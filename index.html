<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Animation Stack</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #ffffff;
  }
  #stack-container {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  .layer-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: auto;
    display: none; /* Hidden by default */
  }
  .slider-container {
    margin-top: 20px;
    width: 80%;
    max-width: 600px;
    z-index: 10;
  }
  input[type=range] {
    width: 100%;
    cursor: pointer;
  }
  .instructions {
    margin-top: 10px;
    color: #666;
    font-size: 14px;
  }
</style>
</head>
<body>

  <!-- The Stacked Images Container -->
  <div id="stack-container">
    <!-- JavaScript will load the images into this box -->
  </div>

  <!-- The Slider -->
  <div class="slider-container">
    <input type="range" id="frame-slider" min="0" value="0">
  </div>
  
  <div class="instructions">
    Use the slider or your <b>Left / Right Arrow Keys</b> to navigate.
  </div>

  <script>
    // --- UPDATE THIS NUMBER TO MATCH YOUR TOTAL NUMBER OF EXPORTED PNGS ---
    const totalFrames = 20; 
    
    // We subtract 1 because we are starting at 000 instead of 1
    const maxIndex = totalFrames - 1; 
    
    const stack = document.getElementById('stack-container');
    const slider = document.getElementById('frame-slider');
    slider.max = maxIndex;

    // 1. Build the image stack in the HTML
    for(let i = 0; i <= maxIndex; i++) {
      let img = document.createElement('img');
      
      // Pad the number with leading zeros (e.g., 0 becomes '000', 12 becomes '012')
      let fileName = String(i).padStart(3, '0') + '.png';
      
      img.src = fileName;
      img.className = 'layer-img';
      img.id = 'layer-' + i;
      
      // Make the bottom layer (000.png) "relative" so it defines the height of the container
      if(i === 0) {
        img.style.position = 'relative'; 
      }
      
      stack.appendChild(img);
    }

    // 2. Function to show layers up to the slider's value
    function updateSlide(val) {
      for(let i = 0; i <= maxIndex; i++) {
        let img = document.getElementById('layer-' + i);
        if(i <= val) {
          img.style.display = 'block'; // Show if it's below or equal to the slider value
        } else {
          img.style.display = 'none';  // Hide if it's ahead of the slider value
        }
      }
      slider.value = val;
    }

    // Initialize the very first frame on load
    updateSlide(0);

    // 3. Listen for mouse sliding
    slider.addEventListener('input', (e) => {
      updateSlide(parseInt(e.target.value));
    });

    // 4. Listen for Arrow Keys
    document.addEventListener('keydown', (e) => {
      let currentVal = parseInt(slider.value);
      if (e.key === 'ArrowRight' && currentVal < maxIndex) {
        updateSlide(currentVal + 1);
      } else if (e.key === 'ArrowLeft' && currentVal > 0) {
        updateSlide(currentVal - 1);
      }
    });
  </script>

</body>
</html>
